# ============================================================
# RÈGLES DE SUIVI
# ============================================================

tracking_rules:
  # Avant chaque modification
  pre_change:
    - "Vérifier que la tâche est dans priority_tasks"
    - "Marquer la tâche comme in_progress"
    - "Annoncer le début du travail (TTS si activé)"

  # Après chaque modification
  post_change:
    - "Mettre à jour le status de la tâche"
    - "Ajouter une entrée dans current_session.completed_tasks"
    - "Mettre à jour les métriques si applicable"
    - "Annoncer la complétion (TTS si activé)"

  # À chaque commit (quand git sera initialisé)
  on_commit:
    - "Vérifier que le changelog est à jour"
    - "Incrémenter la version si nécessaire"
    - "Générer un résumé des changements"
